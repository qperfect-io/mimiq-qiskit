name: Test

# Public-repo CI: runs the test suite on pushes to the synced branches and
# on pull requests. The MIMIQ dependency resolves from PyPI here (the
# private GitLab CI overrides it with a git ref for cross-repo testing).
#
# `uv sync` installs the dev group, which brings in `mimiq-exaqt` so the
# simulation tests run rather than skipping.

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - devel

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Kept inside the range build-system.requires declares, so the
          # backend that builds the wheel is the one pyproject names.
          # setup-uv documents exact versions, not ranges. Bump with it.
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Report the resolved MIMIQ versions
        run: |
          uv run python -c "
          import importlib.metadata as m
          for p in ('mimiqcircuits', 'mimiq-exaqt', 'qiskit'):
              try: print(p, m.version(p))
              except m.PackageNotFoundError: print(p, 'MISSING')
          "

      - name: Run tests
        run: uv run pytest -sxv
